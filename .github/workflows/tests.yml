name: Backend regression tests
on:
  push:
  pull_request:
jobs:
  invoice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests
  finscribe-legacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/finscribe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
